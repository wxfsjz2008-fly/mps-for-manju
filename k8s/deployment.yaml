apiVersion: apps/v1
kind: Deployment
metadata:
  name: mps-for-manju
  namespace: default
  labels:
    app: mps-for-manju
spec:
  replicas: 1
  # 使用 Recreate 策略：先停止旧 Pod，再创建新 Pod
  # 这样可以避免 CBS 云硬盘挂载冲突（CBS 只能挂载到一个 Pod）
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mps-for-manju
  template:
    metadata:
      labels:
        app: mps-for-manju
    spec:
      containers:
        - name: mps-for-manju
          image: xiongfei-test.tencentcloudcr.com/xiongfei/mps-for-manju:v0501
          ports:
            - containerPort: 3001
          env:
            # 从 Secret 中引用腾讯云凭证
            - name: TENCENT_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: mps-tencent-credentials
                  key: TENCENT_SECRET_ID
            - name: TENCENT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mps-tencent-credentials
                  key: TENCENT_SECRET_KEY
            # 其他环境变量
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # 挂载持久化存储卷
          volumeMounts:
            - name: data-volume
              mountPath: /app/data  # SQLite 数据库存储目录（与 Dockerfile 中的路径一致）
      # 定义持久化存储卷
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: mps-data-pvc  # 引用 PVC
---
apiVersion: v1
kind: Service
metadata:
  name: mps-for-manju
  namespace: default
spec:
  selector:
    app: mps-for-manju
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3001
  type: ClusterIP
