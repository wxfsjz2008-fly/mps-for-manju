apiVersion: apps/v1
kind: Deployment
metadata:
  name: mps-for-manju
  namespace: default
  labels:
    app: mps-for-manju
spec:
  replicas: 2  # 使用 MySQL 后可以支持多副本
  # 使用 RollingUpdate 策略实现零停机更新
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # 更新时最多可以超出期望副本数的数量
      maxUnavailable: 0  # 更新时最多不可用的副本数（0 表示零停机）
  selector:
    matchLabels:
      app: mps-for-manju
  template:
    metadata:
      labels:
        app: mps-for-manju
    spec:
      containers:
        - name: mps-for-manju
          image: xiongfei-test.tencentcloudcr.com/xiongfei/mps-for-manju:v0501
          ports:
            - containerPort: 3001
          env:
            # 从 Secret 中引用腾讯云凭证
            - name: TENCENT_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: mps-tencent-credentials
                  key: TENCENT_SECRET_ID
            - name: TENCENT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mps-tencent-credentials
                  key: TENCENT_SECRET_KEY
            # MySQL 数据库配置（从 Secret 中引用）
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: mps-mysql-credentials
                  key: MYSQL_HOST
            - name: MYSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: mps-mysql-credentials
                  key: MYSQL_PORT
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mps-mysql-credentials
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mps-mysql-credentials
                  key: MYSQL_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mps-mysql-credentials
                  key: MYSQL_DATABASE
            # 其他环境变量
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # 健康检查
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mps-for-manju
  namespace: default
spec:
  selector:
    app: mps-for-manju
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3001
  type: ClusterIP
