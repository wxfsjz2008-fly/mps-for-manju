# CNB 构建配置
# 构建 Docker 镜像并推送到腾讯云镜像仓库

main:
  push:
    - services:
        - docker
      env:
        TCR_REGISTRY: xiongfei-test.tencentcloudcr.com
        TCR_USERNAME: "100013033031"
        TCR_PASSWORD: ${{ envs.TCR_PASSWORD }}
        IMAGE_NAME: xiongfei-test.tencentcloudcr.com/xiongfei/mps-for-manju
        IMAGE_TAG: latest
      stages:
        - name: 登录腾讯云镜像仓库
          script: |
            docker login -u $TCR_USERNAME -p "$TCR_PASSWORD" $TCR_REGISTRY
        - name: 构建 Docker 镜像
          script: |
            docker build -t $IMAGE_NAME:$IMAGE_TAG .
        - name: 推送镜像到腾讯云镜像仓库
          script: |
            docker push $IMAGE_NAME:$IMAGE_TAG
